<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050506" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Menu de Navegação — DLuz Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        height: auto !important;
        min-height: 100vh !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        margin: 0;
        background: #050506;
        color: #f1f2f6;
        font-family: 'Archivo', sans-serif;
        display: flex;
        flex-direction: column;
      }
      .menu-page {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        padding: 40px 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .brand-box {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: #fff;
      }
      .brand-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .brand-row {
        display: flex;
        align-items: baseline;
        gap: 5px;
        line-height: 1.1;
      }
      .brand-tagline {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #38bdf8;
        line-height: 1;
        display: block;
        white-space: nowrap;
      }
      @media (max-width: 600px) {
        .brand-tagline {
          font-size: 8.5px;
          letter-spacing: 0.12em;
        }
      }
      .brand-box img {
        height: 28px;
      }
      .brand-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .close-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #fff;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        text-decoration: none;
        transition: all 0.3s;
      }
      .close-btn:hover {
        background: #10b981;
        color: #050506;
        transform: rotate(90deg);
      }
      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin: 60px 0;
      }
      .nav-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 30px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        text-decoration: none;
        color: #fff;
        transition: all 0.3s;
      }
      .nav-item:hover {
        background: rgba(16, 185, 129, 0.06);
        border-color: rgba(16, 185, 129, 0.3);
        transform: translateX(8px);
      }
      .nav-left {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .nav-num {
        font-size: 14px;
        font-weight: 800;
        color: #10b981;
        font-family: 'JetBrains Mono', monospace;
      }
      .nav-name {
        font-size: 28px;
        font-weight: 850;
        text-transform: uppercase;
        letter-spacing: -0.01em;
      }
      .nav-arrow {
        font-size: 24px;
        color: #94a3b8;
        transition: transform 0.3s, color 0.3s;
      }
      .nav-item:hover .nav-arrow {
        color: #10b981;
        transform: translateX(4px);
      }
      .ecosystem-box {
        margin-top: auto;
        padding-top: 40px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #64748b;
        font-size: 13px;
      }
      .ecosystem-links {
        display: flex;
        gap: 20px;
      }
      .ecosystem-links a {
        color: #94a3b8;
        text-decoration: none;
        transition: color 0.3s;
      }
      .ecosystem-links a:hover {
        color: #10b981;
      }
    </style>
  </head>
  <body>
    <div class="menu-page">
      <div class="menu-header">
        <a href="index.html" class="brand-box">
          <img src="assets/dluz_infinity.png" alt="DLuz Digital" />
          <div class="brand-text">
            <div class="brand-row">
              <span class="brand-title">DLuz Digital</span>
            </div>
            <span class="brand-tagline">MARKETING DIGITAL</span>
          </div>
        </a>
        <a href="index.html" class="close-btn" aria-label="Fechar Menu">✕</a>
      </div>

      <nav class="nav-list">
        <a href="index.html#solucoes" class="nav-item">
          <div class="nav-left">
            <span class="nav-num">01</span>
            <span class="nav-name">Soluções 3D Interativas</span>
          </div>
          <span class="nav-arrow">➔</span>
        </a>

        <a href="metodologia.html" class="nav-item">
          <div class="nav-left">
            <span class="nav-num">02</span>
            <span class="nav-name">Metodologia dos 4 Pilares</span>
          </div>
          <span class="nav-arrow">➔</span>
        </a>

        <a href="resultados.html" class="nav-item">
          <div class="nav-left">
            <span class="nav-num">03</span>
            <span class="nav-name">Resultados & Casos Reais</span>
          </div>
          <span class="nav-arrow">➔</span>
        </a>

        <a href="equipe.html" class="nav-item">
          <div class="nav-left">
            <span class="nav-num">04</span>
            <span class="nav-name">Equipe de Especialistas</span>
          </div>
          <span class="nav-arrow">➔</span>
        </a>

        <a href="contato.html" class="nav-item" style="border-color: rgba(16, 185, 129, 0.3);">
          <div class="nav-left">
            <span class="nav-num">05</span>
            <span class="nav-name" style="color: #10b981;">Contato Executivo & WhatsApp</span>
          </div>
          <span class="nav-arrow" style="color: #10b981;">➔</span>
        </a>
      </nav>

      <div class="ecosystem-box">
        <span>© 2026 DLuz Digital • Todos os direitos reservados.</span>
        <div class="ecosystem-links">
          <a href="https://dluz.com.br" target="_blank">Dluz News</a>
          <a href="https://loja.dluz.com.br" target="_blank">Loja Oficial</a>
          <a href="contato.html">Suporte VIP</a>
        </div>
      </div>
    </div>
  </body>
</html>
